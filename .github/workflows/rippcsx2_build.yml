name: RIPPCSX2 lab build

# RIPPCSX2: a Windows x64 AVX2 build and a Linux x64 AppImage of the rippcsx2 branch (PCSX2 v2.9.96 plus the
# fork's changes, see RIPPCSX2.md). Upstream's Windows, Linux and macOS matrices skip this branch.

on:
  push:
    branches:
      - "rippcsx2"
    paths-ignore:
      - "site/**"
      - "tools/site/**"
      - "docs/**"
      - "**.md"
      - "i18n/**"
      - ".github/workflows/rippcsx2_pages.yml"
  workflow_dispatch:

jobs:
  build_deps:
    name: "Dependencies"
    uses: ./.github/workflows/windows_deps_build.yml

  build:
    needs: build_deps
    name: "Windows x64 AVX2"
    uses: ./.github/workflows/windows_build_qt.yml
    with:
      jobName: "RIPPCSX2 MSVC AVX2"
      artifactPrefixName: "RIPPCSX2-windows-x64-avx2"
      configuration: Release AVX2
      fetchTags: true
    secrets: inherit

  build_linux:
    name: "Linux x64"
    uses: ./.github/workflows/linux_build_qt.yml
    with:
      jobName: "RIPPCSX2 AppImage"
      artifactPrefixName: "RIPPCSX2-linux-x64-appimage"
      compiler: clang
      cmakeflags: ""
      buildAppImage: true
      fetchTags: true
    secrets: inherit

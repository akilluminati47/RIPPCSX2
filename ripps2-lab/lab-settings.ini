; The RIPPS2 lab's settings that matter (from its inis\PCSX2.ini, 2026-10-12). Not a whole PCSX2.ini: merge these
; into one. Paths are the RIPPS2 machine's.

[Folders]
Bios = B:\Emulation\PlayStation\PCSX2\bios
Snapshots = snaps
MemoryCards = memcards
Videos = videos

[EmuCore]
EnablePINE = true
PINESlot = 28012
EnableFastBoot = true
HostFs = true
EnableCheats = false
EnableWideScreenPatches = false

[EmuCore/GS]
; RIPPCSX2: HDTV modes shown, captured and saved as an HDTV shows them (16:9, 1280 x 720 / 1920 x 1080)
HDTVOutput = true
Renderer = -1
upscale_multiplier = 1
AspectRatio = Auto 4:3/3:2
deinterlace_mode = 0
pcrtc_antiblur = true
pcrtc_offsets = false
pcrtc_overscan = false
ScreenshotSize = 0
EnableVideoCapture = true
VideoCaptureAutoResolution = false
VideoCaptureWidth = 640
VideoCaptureHeight = 480
VideoCaptureBitrate = 6000

[MemoryCards]
Slot1_Enable = true
Slot1_Filename = RIPPS2-CM1.ps2
Slot2_Enable = true
Slot2_Filename = RIPPS2-CM2.ps2

[DEV9/Hdd]
HddEnable = true
HddFile = B:\Emulation\PlayStation\PCSX2\ripps2-test\ripps2-reel-hdd.raw
